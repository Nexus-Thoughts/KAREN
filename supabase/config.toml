project_id = "cims"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# KAREN accounts are provisioned by an administrator, never self-registered.
# docs/04_RBAC_AND_PERMISSIONS.md — least privilege, deny by default.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# CLI-specific quirk, confirmed against the CLI v2.115.0 binary: this flag is
# NOT "may a user self-register with email" — that is governed by the
# top-level [auth] enable_signup above (-> GOTRUE_DISABLE_SIGNUP). This flag
# instead drives GOTRUE_EXTERNAL_EMAIL_ENABLED, which gates the email
# provider entirely, including sign-IN. Setting it false (as its name
# suggests it safely could be, matching our "no self-registration" intent)
# locks out every provisioned account, not just self-service signup — see
# docs/22_ARCHITECTURE_DECISIONS.md ADR-006 for how this was diagnosed.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.invite]
subject = "You have been invited to KAREN"

[auth.sessions]
# Force re-authentication after 12h of inactivity; academic and location data
# are sensitive (docs/13_SECURITY_AND_PRIVACY.md).
inactivity_timeout = "12h"

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
